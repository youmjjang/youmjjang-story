name: Extract BRB EXE

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-brb-exe.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract EXE from existing v6 package
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          zip_path = Path("downloads/HTTP_Status_Pattern_Analyzer_Windows_v6.zip")
          out_path = Path("downloads/HTTP_Status_Pattern_Analyzer.exe")

          with ZipFile(zip_path) as z:
              names = [n for n in z.namelist() if n.endswith("HTTP_Status_Pattern_Analyzer.exe")]
              if not names:
                  raise SystemExit("EXE not found in ZIP")
              out_path.write_bytes(z.read(names[0]))

          print(f"wrote {out_path} ({out_path.stat().st_size} bytes)")
          PY

      - name: Commit direct EXE download
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/HTTP_Status_Pattern_Analyzer.exe
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Add direct BR-B Windows EXE"
          git push
